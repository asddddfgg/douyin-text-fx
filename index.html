<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音爆款文字排版与 AE 质感特效生成器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 控制面板 -->
<div class="sticky-panel">
  <div class="panel-row">
    
    <!-- 富文本编辑器容器 -->
    <div class="editor-wrapper">
      <div class="editor-toolbar">
        <!-- 第一行：块级与排版 -->
        <div class="tool-row">
          <button class="btn-tool" onclick="applyHeading('h1')" title="一级标题">H1</button>
          <button class="btn-tool" onclick="applyHeading('h2')" title="二级标题">H2</button>
          <button class="btn-tool" onclick="applyHeading('p')" title="正文文本">P</button>
          <button class="btn-tool" onclick="execCmd('bold')" title="加粗"><b>B</b></button>
          <button class="btn-tool" onclick="execCmd('italic')" title="斜体"><i>I</i></button>
          <button class="btn-tool" onclick="execCmd('underline')" title="下划线"><u>U</u></button>
          <button class="btn-tool" onclick="clearFormat()" title="清除格式">清除</button>
        </div>

        <!-- 第二行：底色高亮 -->
        <div class="tool-row">
          <span class="tool-label">底色:</span>
          <button class="btn-tool" onclick="applyHighlight('#ffe066')" style="background:#ffe066;color:#000;">黄</button>
          <button class="btn-tool" onclick="applyHighlight('#ff2d95')" style="background:#ff2d95;color:#fff;">粉</button>
          <button class="btn-tool" onclick="applyHighlight('#00f2ea')" style="background:#00f2ea;color:#000;">青</button>
        </div>

        <!-- 第三行：字色与 Emoji 选择器 -->
        <div class="tool-row">
          <span class="tool-label">字色:</span>
          <button class="btn-tool" onclick="applyColor('#ff0050')" style="color:#ff0050;">红</button>
          <button class="btn-tool" onclick="applyColor('#00f2ea')" style="color:#00f2ea;">青</button>
          <button class="btn-tool" onclick="applyColor('#ffe066')" style="color:#ffe066;">黄</button>

          <!-- 🔥 下拉式 Emoji 选择器（无 SVG，顶级浮层） -->
          <div class="icon-picker-wrapper">
            <button class="btn-tool btn-picker-trigger" id="iconPickerBtn" onclick="toggleIconPicker(event)">😀 图标 ▾</button>
            
            <div class="icon-picker-panel" id="iconPickerPanel" onclick="event.stopPropagation()">
              <div class="picker-group">
                <span class="group-title">🔥 爆款热门</span>
                <div class="group-icons">
                  <span onclick="selectIcon('🔥')">🔥</span>
                  <span onclick="selectIcon('💡')">💡</span>
                  <span onclick="selectIcon('📌')">📌</span>
                  <span onclick="selectIcon('⚠️')">⚠️</span>
                  <span onclick="selectIcon('✨')">✨</span>
                  <span onclick="selectIcon('🚀')">🚀</span>
                  <span onclick="selectIcon('🎯')">🎯</span>
                  <span onclick="selectIcon('💎')">💎</span>
                  <span onclick="selectIcon('📈')">📈</span>
                  <span onclick="selectIcon('🎁')">🎁</span>
                </div>
              </div>

              <div class="picker-group">
                <span class="group-title">👉 提示手势</span>
                <div class="group-icons">
                  <span onclick="selectIcon('👇')">👇</span>
                  <span onclick="selectIcon('👉')">👉</span>
                  <span onclick="selectIcon('👆')">👆</span>
                  <span onclick="selectIcon('👍')">👍</span>
                  <span onclick="selectIcon('👏')">👏</span>
                  <span onclick="selectIcon('🙌')">🙌</span>
                  <span onclick="selectIcon('💪')">💪</span>
                  <span onclick="selectIcon('✅')">✅</span>
                  <span onclick="selectIcon('❌')">❌</span>
                  <span onclick="selectIcon('❓')">❓</span>
                </div>
              </div>

              <div class="picker-group">
                <span class="group-title">🌟 情绪标号</span>
                <div class="group-icons">
                  <span onclick="selectIcon('😍')">😍</span>
                  <span onclick="selectIcon('😱')">😱</span>
                  <span onclick="selectIcon('🤯')">🤯</span>
                  <span onclick="selectIcon('😎')">😎</span>
                  <span onclick="selectIcon('1️⃣')">1️⃣</span>
                  <span onclick="selectIcon('2️⃣')">2️⃣</span>
                  <span onclick="selectIcon('3️⃣')">3️⃣</span>
                  <span onclick="selectIcon('4️⃣')">4️⃣</span>
                  <span onclick="selectIcon('5️⃣')">5️⃣</span>
                  <span onclick="selectIcon('💯')">💯</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="textInput" contenteditable="true" class="rich-editor" placeholder="在此输入文案，拖动任意卡片中的文本框调整大小，自动按框底部边缘物理分页...">今天也要元气满满，加油！冲冲冲。<br>这是一段较长的测试文本，如果在框内自动折行或者手动换行超过设定的框高度，就会自动分页生成第二张图片。<br>这里是超过框高度后的内容，会自动归入第2张卡片！</div>
    </div>

    <div class="control-group">
      <label>字号</label>
      <input type="range" id="fontSize" min="12" max="33" value="18" step="1">
      <span id="fontSizeVal">18</span>px
    </div>
    <div class="control-group">
      <label>行距</label>
      <input type="range" id="lineHeight" min="1.0" max="2.5" value="1.4" step="0.1">
      <span id="lineHeightVal">1.4</span>
    </div>
    <div class="control-group">
      <label>字间距</label>
      <input type="range" id="letterSpacing" min="0" max="10" value="0" step="1">
      <span id="letterSpacingVal">0</span>px
    </div>
    <div class="control-group">
      <button class="btn" id="boldBtn">B 全局加粗</button>
      <button class="btn active" data-align="left">左对齐</button>
      <button class="btn" data-align="center">居中</button>
      <button class="btn" data-align="right">右对齐</button>
    </div>
  </div>

  <div class="panel-row">
    <div class="control-group">
      <label>文字基础颜色</label>
      <input type="color" id="textColor" value="#ffffff">
      <button class="btn" id="resetColorBtn">重置</button>
    </div>

    <div class="control-group">
      <label>背景色</label>
      <div class="bg-swatches" id="bgSwatches">
        <div class="swatch active" style="background:#f5f5f5" data-bg="#f5f5f5"></div>
        <div class="swatch" style="background:#1a1a1a" data-bg="#1a1a1a"></div>
        <div class="swatch" style="background:#000" data-bg="#000000"></div>
        <div class="swatch" style="background:#e8f4f8" data-bg="#e8f4f8"></div>
        <div class="swatch" style="background:#fff8e7" data-bg="#fff8e7"></div>
        <div class="swatch" style="background:#2d1b4e" data-bg="#2d1b4e"></div>
      </div>
      <input type="color" id="customBg" value="#f5f5f5" title="自定义背景色">
      <button class="btn" id="saveBgBtn">收藏当前背景</button>
    </div>

    <div class="control-group" id="savedBgSection" style="display:none;">
      <label>收藏背景</label>
      <div class="bg-swatches" id="savedBgList"></div>
    </div>

    <div class="control-group">
      <label>背景图</label>
      <input type="file" id="bgImageInput" accept="image/*" style="font-size:12px;width:140px;">
      <label>亮度</label>
      <input type="range" id="bgBrightness" min="0.3" max="1.5" value="1" step="0.05" style="width:60px;">
      <label>透明</label>
      <input type="range" id="bgOpacity" min="0" max="1" value="1" step="0.05" style="width:60px;">
      <button class="btn" id="clearBgBtn">清除</button>
    </div>
  </div>

  <div class="panel-row">
    <div class="control-group">
      <label>视图</label>
      <button class="btn" data-view="safe">安全线</button>
      <button class="btn active" data-view="phone">手机外观</button>
      <button class="btn" data-view="pure">纯正文</button>
    </div>

    <div class="control-group">
      <label>导出清晰度</label>
      <input type="range" id="exportScale" min="3" max="6" value="3" step="1" style="width:70px;">
      <span id="exportScaleVal">3</span>× 高清
    </div>

    <div class="control-group">
      <label>本地字体</label>
      <input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2" style="font-size:12px;width:130px;">
      <button class="btn" id="resetFontBtn">系统字体</button>
      <span class="font-info" id="fontInfo">未加载自定义字体</span>
      <span class="storage-info" id="storageInfo"></span>
    </div>

    <div class="control-group">
      <button class="btn" id="toggleEffectsBtn">效果筛选 ▾</button>
      <span id="effectCount">72 / 72</span>
    </div>

    <div class="control-group">
      <button class="btn export" id="exportAllBtn">批量导出全部</button>
    </div>

    <div class="control-group">
      <label>预设</label>
      <input type="text" id="presetName" placeholder="预设名" style="width:80px;background:#111;border:1px solid #444;color:#fff;border-radius:4px;padding:3px 6px;font-size:12px;">
      <button class="btn" id="savePresetBtn">保存</button>
      <div class="preset-list" id="presetList"></div>
    </div>
  </div>

  <div class="effects-drawer" id="effectsDrawer">
    <div class="effect-chips" id="effectChips"></div>
  </div>
</div>

<!-- 预览网格 -->
<div class="preview-grid" id="previewGrid"></div>

<!-- 本地无跨域兼容加载顺序 -->
<script src="./js/db.js"></script>
<script src="./js/effects.js"></script>
<script src="./js/state.js"></script>
<script src="./js/drag.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
